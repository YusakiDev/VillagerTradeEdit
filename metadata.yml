name: VillagerTradeEdit
summary: Edit villager trades and manage static villager merchants.

compatibility:
  minecraft:
    min: "26.1"
    max: "26.2"
  software:
    paper: supported
    folia: supported
    purpur: supported
    canvas: supported

dependencies:
